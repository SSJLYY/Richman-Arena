<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="icon.svg" type="image/svg+xml"/>
  <title>大富翁在线 - Monopoly Online</title>
  <link rel="stylesheet" href="style.css?v=2182"/>
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading" class="loading-screen">
      <div class="loading-content">
        <div class="loading-dice">
          <div class="die"><span>🎲</span></div>
          <div class="die"><span>🎲</span></div>
        </div>
        <h1>大富翁在线</h1>
        <p class="loading-text">正在连接服务器...</p>
        <div class="loading-bar"><div class="loading-fill"></div></div>
      </div>
    </div>

    <!-- Lobby (Home) -->
    <div id="lobby" class="lobby hidden">
      <div class="lobby-card">
        <div class="lobby-head">
          <h1 class="logo">🎲 大富翁在线</h1>
          <span class="version">v2.18</span>
        </div>
        <p class="lobby-sub">和机器人或朋友来一局经典大富翁</p>

        <div class="lobby-grid">
          <div class="lobby-col">
            <div class="lobby-section">
              <h2>👤 你的身份</h2>
              <div class="lobby-form">
                <input type="text" id="lobbyName" placeholder="输入昵称" maxlength="16" autocomplete="off"/>
                <div id="avatarGrid" class="avatar-grid"></div>
              </div>
            </div>

            <div class="lobby-section">
              <h2>🎮 开始游戏</h2>
              <div class="lobby-actions">
                <button id="lobbyCreateBtn" class="btn btn-lg btn-primary">🏠 创建新房间</button>
                <button id="lobbySoloBtn" class="btn btn-lg btn-warning" title="自动建房 + 3个机器人 + 开局">🤖 单人快速开局</button>
                <div class="lobby-join">
                  <input type="text" id="joinRoomInput" placeholder="输入房间号" maxlength="24"/>
                  <button id="joinRoomBtn" class="btn btn-lg btn-success">加入</button>
                </div>
              </div>
            </div>
          </div>

          <div class="lobby-col">
            <div class="lobby-section">
              <h2>📋 房间列表 <button class="btn btn-sm btn-ghost" id="refreshRoomsBtn">🔄 刷新</button></h2>
              <div id="lobbyRoomList" class="lobby-rooms">
                <p class="lobby-empty" id="lobbyEmpty">暂无房间，创建一个吧！</p>
              </div>
            </div>

            <div class="lobby-section">
              <h2>🏆 胜局排行榜</h2>
              <div id="myStatsLine" class="my-stats-line"></div>
              <div id="lobbyStats" class="stats-list">
                <p class="lobby-empty">暂无战绩，开一局吧！</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main App (Game view) -->
    <div id="mainApp" class="main-app hidden">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button id="backBtn" class="btn btn-icon" aria-label="返回大厅" title="返回大厅">🏠</button>
          <h1 class="logo">大富翁在线</h1>
          <span class="version">v2.18</span>
        </div>
        <div class="header-center">
          <div class="room-selector">
            <span class="room-label" id="roomLabel">房间: -</span>
            <button class="btn btn-sm btn-ghost" id="inviteBtn" title="复制邀请链接，朋友打开直接进房" style="display:none;">📋 邀请</button>
            <button class="btn btn-sm btn-ghost" id="chartBtn" title="净资产趋势" style="display:none;">📈 趋势</button>
            <button class="btn btn-sm btn-ghost" id="overviewBtn" title="地产总览" style="display:none;">📋 总览</button>
          </div>
        </div>
        <div class="header-right">
          <div class="my-info" id="myInfo" style="display:none;">
            <span class="my-avatar" id="myAvatar"></span>
            <span class="my-name" id="myName"></span>
            <span class="my-money" id="myMoney">¥0</span>
          </div>
          <button id="helpBtn" class="btn btn-icon" aria-label="帮助" title="帮助 (H)">❓</button>
          <button id="settingsBtn" class="btn btn-icon" aria-label="设置" title="设置">⚙️</button>
        </div>
      </header>

      <!-- Main Layout -->
      <main class="main-layout">
        <!-- Left: Game Board -->
        <section class="board-section" id="boardSection">
          <!-- Current Turn Indicator (above board, never overlaps) -->
          <div id="turnBanner" class="turn-banner hidden" aria-live="assertive">
            <span class="turn-avatar" id="turnAvatar"></span>
            <span class="turn-text" id="turnText"></span>
          </div>

          <div class="board-container" id="boardContainer">
            <div class="board-wrapper" id="boardWrapper">
              <div id="board" class="board" role="application" aria-label="游戏棋盘">
                <div id="tokenLayer" class="token-layer"></div>
              </div>
            </div>
            <div class="board-controls">
              <button class="btn btn-icon zoom-btn" id="zoomIn" aria-label="放大" title="放大">🔍+</button>
              <button class="btn btn-icon zoom-btn" id="zoomOut" aria-label="缩小" title="缩小">🔍-</button>
              <button class="btn btn-icon zoom-btn" id="zoomReset" aria-label="重置" title="重置">⌂</button>
            </div>
          </div>

          <div id="moneyFloatLayer" class="money-float-layer"></div>

          <!-- Drawn Card Overlay -->
          <div id="cardOverlay" class="card-overlay hidden" role="status" aria-live="polite">
            <div class="drawn-card">
              <div class="dc-icon" id="dcIcon">❓</div>
              <div class="dc-type" id="dcType">机会</div>
              <div class="dc-text" id="dcText"></div>
            </div>
          </div>

          <!-- Auction Panel -->
          <div id="auctionPanel" class="auction-panel hidden">
            <div class="ap-head">
              <span class="ap-title">🔨 拍卖中：<b id="apName"></b></span>
              <button class="btn btn-sm btn-ghost" id="apHideBtn" title="收起">收起</button>
            </div>
            <div class="ap-body">
              <div class="ap-bid">当前最高 <b id="apTopBid">¥0</b><span id="apTopBidder" class="ap-bidder"></span></div>
              <div class="ap-timer" id="apTimer">--s</div>
              <div class="ap-actions">
                <button class="btn btn-sm btn-warning" id="apBid100" title="快捷键 1">+100</button>
                <button class="btn btn-sm btn-warning" id="apBid500" title="快捷键 2">+500</button>
                <button class="btn btn-sm btn-warning" id="apBid1000" title="快捷键 3">+1000</button>
              </div>
            </div>
            <div class="ap-rent" id="apRent"></div>
            <div class="ap-history" id="apHistory"></div>
          </div>

          <!-- Dice Animation Overlay -->
          <div id="diceOverlay" class="dice-overlay hidden" role="status" aria-live="polite">
            <div class="dice-popup">
              <div class="dice-header">掷骰子</div>
              <div class="dice-animation">
                <div class="die-3d" id="die1"><div class="die-face">🎲</div></div>
                <div class="die-3d" id="die2"><div class="die-face">🎲</div></div>
              </div>
              <div class="dice-result" id="diceResult"></div>
            </div>
          </div>
        </section>

        <!-- Right: Side Panels -->
        <aside class="side-panel" id="sidePanel">
          <!-- Player Panel -->
          <div class="panel-card player-panel">
            <div class="panel-header">
              <h2>👥 玩家</h2>
              <div class="panel-header-btns">
                <button class="btn btn-sm btn-ghost" id="tradeBtn" title="发起交易" disabled>🤝 交易</button>
                <button class="btn btn-sm btn-danger" id="exitBtn" title="退出房间，席位由机器人接管">🚪 退出</button>
              </div>
            </div>
            <div id="playersList" class="players-list"></div>
          </div>

          <!-- Action Panel -->
          <div class="panel-card action-panel">
            <h2>🎮 操作</h2>
            <div class="action-buttons" id="actionButtons">
              <div class="round-limit-row" id="roundLimitRow" style="display:none;">
                <label for="maxRoundsSel">⏱ 回合上限</label>
                <select id="maxRoundsSel">
                  <option value="0">不限（破产定胜负）</option>
                  <option value="30">30 回合（快速局）</option>
                  <option value="50">50 回合</option>
                  <option value="80">80 回合</option>
                </select>
              </div>
              <div class="round-limit-row room-settings" id="roomSettingsRow" style="display:none;">
                <label for="mapSel">🗺 地图</label>
                <select id="mapSel">
                  <option value="classic">经典版</option>
                  <option value="china">中国城市版</option>
                </select>
                <label for="startMoneySel">💰 资金</label>
                <select id="startMoneySel">
                  <option value="8000">¥8,000</option>
                  <option value="10000">¥10,000</option>
                  <option value="15000" selected>¥15,000</option>
                  <option value="20000">¥20,000</option>
                  <option value="30000">¥30,000</option>
                </select>
                <label for="turnTimeSel">⏱ 回合限时</label>
                <select id="turnTimeSel">
                  <option value="30000">30 秒</option>
                  <option value="60000">1 分钟</option>
                  <option value="120000" selected>2 分钟</option>
                </select>
                <label class="chk"><input type="checkbox" id="jackpotChk" checked/>🎁奖池</label>
                <label class="chk"><input type="checkbox" id="auctionChk" checked/>🔨拍卖</label>
              </div>
              <button class="btn btn-lg btn-primary" id="startBtn" disabled>▶ 开始游戏</button>
              <button class="btn btn-lg btn-success" id="rollBtn" disabled>
                <span class="btn-icon">🎲</span>
                <span>掷骰子</span>
              </button>
              <button class="btn btn-lg btn-warning" id="bailBtn" disabled style="display:none;">💰 保释 ¥1000</button>
              <button class="btn btn-lg btn-warning" id="buyBtn" disabled>💰 购买</button>
              <button class="btn btn-lg btn-info" id="buildBtn" disabled>🏗 建设</button>
              <button class="btn btn-lg btn-secondary" id="mortgageBtn" disabled>🏦 抵押</button>
              <button class="btn btn-lg btn-info" id="delegateBtn" style="display:none;">🕹 托管</button>
              <button class="btn btn-lg btn-danger" id="endTurnBtn" disabled>⏭ 结束回合</button>
              <button class="btn btn-lg btn-primary" id="botBtn" style="grid-column:1 / -1;">🤖 添加机器人（单人开局）</button>
            </div>
            <div class="action-hint" id="actionHint"></div>
            <div class="turn-timer" id="turnTimer"></div>
            <div class="quick-stats" id="quickStats"></div>
          </div>

          <!-- Chat / Log Panel -->
          <div class="panel-card chat-panel">
            <div class="panel-header">
              <h2>💬 消息</h2>
              <select id="logFilter" class="log-filter">
                <option value="all">全部</option>
                <option value="game">游戏</option>
                <option value="chat">聊天</option>
                <option value="system">系统</option>
              </select>
            </div>
            <div id="log" class="log-container" role="log" aria-live="polite"></div>
            <div class="quick-reactions" id="quickReactions">
              <button data-emoji="👍" title="赞">👍</button>
              <button data-emoji="😂" title="笑">😂</button>
              <button data-emoji="😱" title="惊">😱</button>
              <button data-emoji="🤑" title="发钱">🤑</button>
              <button data-emoji="🔥" title="精彩">🔥</button>
              <button data-emoji="😭" title="惨">😭</button>
            </div>
            <div class="chat-input-area">
              <input type="text" id="chatInput" placeholder="输入消息..." maxlength="300" autocomplete="off"/>
              <button class="btn btn-primary" id="sendChatBtn">发送</button>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <!-- Modals -->
    <div id="modalRoot"></div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js?v=2180"></script>
</body>
</html>
